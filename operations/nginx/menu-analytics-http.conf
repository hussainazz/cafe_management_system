# Include this file from the Nginx http {} context.

map $uri $cafe_analytics_uri {
    ~^/t/ /t/[redacted];
    default $uri;
}

map $uri $cafe_analytics_qr_request_id {
    default "";
    ~^/t/ $request_id;
}

map $uri $cafe_analytics_qr_visit_id {
    default "";
    =/menu $cookie_menu_qr_visit;
}

log_format cafe_menu_analytics escape=json
    '{"timestamp":"$time_iso8601",'
    '"client_ip":"$remote_addr",'
    '"method":"$request_method",'
    '"uri":"$cafe_analytics_uri",'
    '"status":"$status",'
    '"body_bytes_sent":"$body_bytes_sent",'
    '"content_type":"$sent_http_content_type",'
    '"qr_request_id":"$cafe_analytics_qr_request_id",'
    '"qr_visit_id":"$cafe_analytics_qr_visit_id"}';
