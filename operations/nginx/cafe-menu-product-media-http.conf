# Include from the Nginx http {} context. Cache only successful canonical
# product-media responses; 3xx and all error statuses stay private to caches.
map $status $cafe_product_media_cache_control {
    ~^(2[0-9][0-9]|304)$ "public, max-age=2592000, immutable";
    default "no-store, max-age=0";
}
