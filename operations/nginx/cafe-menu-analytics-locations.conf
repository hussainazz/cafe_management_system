# Add these locations to the HTTPS runncafe.ir server, before location /.

location = /menu {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Nginx owns this policy at the origin. Hide framework headers so exactly
    # one Cache-Control value reaches the browser or CDN.
    proxy_hide_header Cache-Control;
    add_header Cache-Control "private, no-cache, no-store, max-age=0, must-revalidate" always;

    # The request is logged before this response clears the one-time marker.
    add_header Set-Cookie "menu_qr_visit=; Max-Age=0; Path=/; HttpOnly; Secure; SameSite=Lax" always;
}

location ^~ /t/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_hide_header Cache-Control;
    add_header Cache-Control "private, no-store, max-age=0" always;

    # Nginx's request ID is logged on this redirect and carried only until /menu.
    add_header Set-Cookie "menu_qr_visit=$request_id; Max-Age=120; Path=/; HttpOnly; Secure; SameSite=Lax";
}
