# Include inside the HTTPS runncafe.ir server block after the /menu and /t/
# analytics locations. This file supplies the general location / fallback.
#
# Dynamic responses have one authoritative origin cache policy at Nginx.
# Public static paths bypass these no-store locations and retain their
# application Cache-Control values.

# The canonical uploaded-image URL is validated against the current public
# ProductImage record by Fastify. Nginx strips the API prefix and owns the
# response policy so every non-success response, including redirects, is
# no-store. Browser requests do not traverse the menu or POS app servers.
location ^~ /media/products/uploads/ {
    limit_except GET HEAD {
        deny all;
    }

    proxy_pass http://127.0.0.1:3001/api/v1/media/products/uploads/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_hide_header Cache-Control;
    add_header Cache-Control $cafe_product_media_cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
}

# Generated content-addressed images are files under the web release's public
# directory. Nginx serves these directly without proxying image bytes through
# Next.js, Fastify, or the POS app.
location ~ "^/media/products/bundled/[0-9a-f]{64}\.(?:jpg|png|webp)$" {
    limit_except GET HEAD {
        deny all;
    }

    root /opt/cafe-menu/apps/web/public;
    types {
        image/jpeg jpg;
        image/png png;
        image/webp webp;
    }
    try_files $uri =404;
    add_header Cache-Control $cafe_product_media_cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
}

# Unknown names inside the dedicated namespace never fall through to HTML or
# any administrative/API route.
location /media/products/ {
    add_header Cache-Control $cafe_product_media_cache_control always;
    return 404;
}

location = /pos {
    proxy_pass http://127.0.0.1:3002;
    proxy_http_version 1.1;
    proxy_set_header Host runncafe.ir;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_hide_header Cache-Control;
    add_header Cache-Control "private, no-store, max-age=0" always;
}

# The POS app uses Next.js basePath=/pos. Keep its build-ID-fingerprinted
# production assets cacheable while the POS HTML and APIs remain private.
location ^~ /pos/_next/static/ {
    proxy_pass http://127.0.0.1:3002;
    proxy_http_version 1.1;
    proxy_set_header Host runncafe.ir;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /pos/ {
    proxy_pass http://127.0.0.1:3002;
    proxy_http_version 1.1;
    proxy_set_header Host runncafe.ir;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_hide_header Cache-Control;
    add_header Cache-Control "private, no-store, max-age=0" always;
}

# This exact Next.js image proxy validates opaque UUID keys and image type,
# then emits immutable headers for successful image responses and no-store on
# validation, missing-file, and upstream-error responses.
location ^~ /api/product-images/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# All other API responses include public menu data, customer context/actions,
# authentication, and their errors. None are shared-cacheable.
location ^~ /api/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_hide_header Cache-Control;
    add_header Cache-Control "private, no-store, max-age=0" always;
}

# Public menu product images and the older public /items image paths keep the
# existing application cache headers. A missing /items object remains no-store.
location ^~ /items_pictures/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /items/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Next.js build-ID-fingerprinted menu assets are immutable public files.
location ^~ /_next/static/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Root-level menu brand images have public, revalidation-oriented headers.
location = /run-cafe-logo.webp {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /Logo.png {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /icon.svg {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# All other web responses, including HTML, redirects, and unknown dynamic
# routes, remain private at the origin.
location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_hide_header Cache-Control;
    add_header Cache-Control "private, no-store, max-age=0" always;
}
