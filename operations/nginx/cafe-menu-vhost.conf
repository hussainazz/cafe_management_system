# Install as /etc/nginx/sites-enabled/cafe-menu.

server {
    server_name runncafe.ir www.runncafe.ir;

    include /etc/nginx/snippets/cafe-menu-analytics-locations.conf;
    include /etc/nginx/snippets/cafe-menu-cache-locations.conf;

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/runncafe.ir/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/runncafe.ir/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    listen 80;
    listen [::]:80;

    server_name 185.97.116.250;

    add_header Cache-Control "private, no-store, max-age=0" always;
    return 301 https://runncafe.ir/menu;
}

server {
    listen 80;
    listen [::]:80;
    server_name runncafe.ir www.runncafe.ir;

    # Keep HTTP-01 validation available at the origin after CDN proxying.
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
        add_header Cache-Control "no-store, max-age=0" always;
    }

    location / {
        add_header Cache-Control "private, no-store, max-age=0" always;
        return 301 https://$host/menu;
    }
}
